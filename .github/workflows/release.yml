name: Release CLI

# Auto-release the CLI on merge to main (Release Please style):
# conventional-commit merges accumulate into a release PR; merging that PR
# tags the version, cuts a GitHub Release, publishes to npm, and attaches
# standalone binaries for every platform.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs['packages/cli--release_created'] }}
      tag: ${{ steps.rp.outputs['packages/cli--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # GITHUB_TOKEN is enough: events made with it don't trigger
          # pull_request workflows, so the auto-merge step below dispatches the
          # CI workflow itself via workflow_dispatch (the documented exception).
          token: ${{ secrets.GITHUB_TOKEN }}

      # Turn on auto-merge for the release PR so it merges itself once the
      # required CI checks (incl. integration tests) go green. Requires the repo
      # setting "Allow auto-merge" + branch protection requiring those checks.
      - name: Enable auto-merge on the release PR
        if: ${{ steps.rp.outputs['packages/cli--release_created'] != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The PR is created moments earlier in this same job; allow for label
          # propagation before giving up.
          pr=""
          for i in $(seq 1 10); do
            pr=$(gh pr list --state open --label "autorelease: pending" --json number --jq '.[0].number')
            [ -n "$pr" ] && break
            sleep 3
          done
          if [ -n "$pr" ]; then
            # The release PR was opened with GITHUB_TOKEN, and events made with
            # GITHUB_TOKEN don't trigger pull_request workflows. workflow_dispatch
            # is the documented exception, so dispatch CI at the PR's head branch.
            # That run reports the required checks ('OpenAPI + typecheck + build',
            # 'CLI typecheck + build') on the PR's head commit, which is what
            # branch protection and auto-merge wait on.
            branch=$(gh pr view "$pr" --json headRefName --jq .headRefName)
            gh workflow run ci.yml --ref "$branch"
            gh pr merge "$pr" --auto --squash && echo "auto-merge enabled on PR #$pr"
          else
            echo "no pending release PR"
          fi

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Idempotent: skip if this version is already on npm, so re-runs are safe.
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@skeptrune/skcal@$v" version >/dev/null 2>&1; then
            echo "npm already has $v — skipping publish"
          else
            npm publish --access public
          fi

      # Standalone binaries are built per-platform on native runners by
      # .github/workflows/binaries.yml, which fires on the GitHub Release this
      # publish creates (and can be re-run manually via workflow_dispatch).
